services:

  postgres:
    image: postgres:17
    container_name: transportes-postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${DRIVER_DB}

    ports:
      - "${POSTGRES_HOST_PORT}:5432"

    volumes:
      - transportes_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${DRIVER_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

volumes:
  transportes_postgres_data: