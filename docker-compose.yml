services:

  postgres:
    image: postgres:17
    container_name: transportes-postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres

    ports:
      - "${POSTGRES_HOST_PORT}:5432"

    volumes:
      - transportes_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

  driver-service:
    build:
      context: ./driver-service

    container_name: driver-service

    environment:
      SERVER_PORT: 8081

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DRIVER_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}

    ports:
      - "8081:8081"

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped


  order-service:
    build:
      context: ./order-service

    container_name: order-service

    environment:
      SERVER_PORT: 8082

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${ORDER_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      DRIVER_SERVICE_URL: http://driver-service:8081

      JWT_SECRET: ${JWT_SECRET}

      APP_USERNAME: ${APP_USERNAME}
      APP_PASSWORD: ${APP_PASSWORD}

      STORAGE_LOCATION: /app/uploads

    ports:
      - "8082:8082"

    volumes:
      - order_uploads:/app/uploads

    depends_on:
      postgres:
        condition: service_healthy
      driver-service:
        condition: service_started

    restart: unless-stopped


volumes:
  transportes_postgres_data:
  order_uploads: